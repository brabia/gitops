apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.ingress.enabled }}
  annotations:
    # BackendConfig required by GKE ingress controller when FrontendConfig is active
    cloud.google.com/backend-config: '{"default": "{{ .Release.Name }}-backend-config"}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
