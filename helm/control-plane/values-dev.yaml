# ── Dev overrides ─────────────────────────────────────────────────────────────

image:
  repository: europe-west1-docker.pkg.dev/replenit-lab/linexa/control-plane
  tag: "0.0.2"               # source of truth is versions.yaml — keep in sync

service:
  type: NodePort             # GKE GCE Ingress requires NodePort

cloudArmor:
  enabled: false
  policyName: linexa-dev-allowlist

ingress:
  enabled: true
  host: dev.linexa.eu
  staticIpName: linexa-dev-ip
  managedCert: false         # re-enable once real DNS points to the LB IP
