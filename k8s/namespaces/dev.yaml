apiVersion: v1
kind: Namespace
metadata:
  name: linexa-dev
  labels:
    environment: dev
    app.kubernetes.io/name: linexa
    # Required by Pod Security Standards (Kubernetes 1.25+)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: linexa-dev-quota
  namespace: linexa-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: linexa-dev-limits
  namespace: linexa-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
