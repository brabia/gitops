# Apply to every linexa namespace (control plane + all tenants).
#
# kubectl apply -f this file -n linexa-dev
# kubectl apply -f this file -n linexa-tenant-cfd4486
# kubectl apply -f this file -n linexa-tenant-3622fab
# kubectl apply -f this file -n linexa-tenant-3bf9bd5
#
# Effect: pods in this namespace accept inbound traffic ONLY from
# the GCP LB and from pods within the same namespace.
# Cross-namespace pod-to-pod traffic (e.g. MySQL) is blocked at ingress.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-isolation
spec:
  podSelector: {}          # applies to every pod in the namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # allow traffic from pods in the same namespace
    - from:
        - podSelector: {}
    # allow GCP LB health checks (originate from kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # allow GCP LB forwarded traffic on port 80
    # GKE SNATs LB traffic to node IPs — these are not pod IPs so
    # podSelector/namespaceSelector cannot match them; allow by port only
    - ports:
        - protocol: TCP
          port: 80
  egress:
    # allow DNS — port-only so it matches kube-dns ClusterIP (10.52.0.10)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # allow all outbound (internet + cluster Services including own MySQL)
    # cross-tenant isolation is enforced by the ingress podSelector rule:
    # MySQL in each namespace only accepts connections from same-namespace pods
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
